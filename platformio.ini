; CYBER CLOCK — M5Stack Tab5 (ESP32-P4) 构建配置
;
; 参考: tobozo/M5Tab5-Game-and-Watch / M5Stack 官方文档
;
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.f_cpu = 360000000L
board_build.f_psram = 200000000L
board_build.img_freq = 40m           ; DSI 时钟
board_build.partitions = app3M_fat9M_16MB.csv
board_build.psram = enable
board_build.psram_mode = oct
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_type = debug
framework = arduino

build_flags =
    -DARDUINO_M5STACK_TAB5
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I src    ; 优先包含我们的 sdkconfig.h (覆盖 qio_qspi 的默认值)

lib_deps =
    ; Launcher 使用稳定版 M5Unified, develop 分支有触控检测时序问题
    m5stack/M5Unified @ ^0.2.17

; 共享源文件 (暂无, 后续添加 wifisetup 等)
build_src_filter = +<*>

; 工具链覆盖: IDF 的 Espressif 定制工具链 (支持 xesppie)
extra_scripts = src/override_toolchain.py

; 升级 Arduino 核心到 3.3.10 + 定制 libs 支持 PSRAM 200MHz OPI
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.10/esp32-core-3.3.10.zip
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/launcher_tab5_esp32-arduino-libs-20260519-233957.tar.xz

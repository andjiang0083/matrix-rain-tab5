name: build

# Compile-only check — no hardware, no secrets, safe for fork PRs.
# Proves every push/PR builds from a clean tree (the project's own rule,
# CONTRIBUTING.md) and attaches the merged image so reviewers can inspect it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO Core
        run: |
          python3 -m pip install --quiet -U platformio
          pio --version

      # The runner has no ~/.espressif. Install the same GCC 14.x release
      # BUILDING.md §1 prescribes, into a VERSION-NAMED directory
      # (~/.espressif/tools/riscv32-esp-elf/esp-14.2.0_20260121/…) — that is the
      # layout an ESP-IDF install produces and the one src/override_toolchain.py's
      # "prefer 14.x" check matches. Extracting straight into the parent dir
      # yields ".../riscv32-esp-elf/" (no version in the name), which silently
      # drops CI into the toolchain script's fallback branch — the primary path
      # would never be exercised here.
      - name: Install riscv32-esp-elf toolchain (GCC 14.x)
        run: |
          TOOLCHAIN=esp-14.2.0_20260121
          URL=https://github.com/espressif/crosstool-NG/releases/download/${TOOLCHAIN}/riscv32-esp-elf-14.2.0_20260121-x86_64-linux-gnu.tar.xz
          DEST="$HOME/.espressif/tools/riscv32-esp-elf/${TOOLCHAIN}"
          mkdir -p "$DEST"
          curl -fsSL --retry 3 "$URL" | tar -xJ -C "$DEST"
          "$DEST/riscv32-esp-elf/bin/riscv32-esp-elf-g++" --version | head -1

      # Cache PlatformIO packages between runs (first run downloads ~1.5 GB).
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Build (clean tree)
        run: |
          rm -rf .pio
          pio run -e tab5

      # The same pre-flight the project runs before every release
      # (tools/make_release.sh) — with the same ASSERTIONS, not warnings:
      # merged image, magic bytes at each offset, size sanity, DIO flash mode.
      # A regression has to fail here: M5Burner writes the file it is given at
      # offset 0x0, so a wrong flash mode or a mis-merged image flashes fine
      # over USB and then bricks the bootloader.
      - name: Verify merged image
        run: |
          python3 - <<'PY'
          p = '.pio/build/tab5/firmware.factory.bin'
          d = open(p, 'rb').read()
          assert len(d) >= 0x10001, "image is %d bytes — truncated, not a merged image" % len(d)
          assert d[0x2000] == 0xE9, "no bootloader image at 0x2000 — wrong merge offsets"
          assert d[0x8000:0x8002] == b'\xaa\x50', "no partition table at 0x8000"
          assert d[0x10000] == 0xE9, "no application image at 0x10000"
          assert len(d) < 2 * 1024 * 1024, "image is %d bytes — padded to the whole flash?" % len(d)
          mode = d[0x2002]
          print("%d bytes, bootloader flash_mode = 0x%02x" % (len(d), mode),
                "(DIO OK)" if mode == 0x02 else "(NOT DIO)")
          assert mode == 0x02, "flash mode is not DIO — M5Burner writes at 0x0 and would brick the bootloader"
          PY

      - name: Attach firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matrix-rain-tab5-firmware-${{ github.sha }}
          path: |
            .pio/build/tab5/firmware.factory.bin
            .pio/build/tab5/firmware.bin
          if-no-files-found: error
